<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="社会クイズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191c" media="(prefers-color-scheme: dark)">
<title>社会データバンク 暗記クイズ</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#22262b;--sub:#6b7280;--line:#e2ded3;--acc:#1f6f5c;--acc2:#e8f3ef;--ok:#1d8a4e;--okbg:#e4f5ea;--ng:#c0392b;--ngbg:#fbe9e6;--gold:#d99a1c}
@media(prefers-color-scheme:dark){:root{--bg:#16191c;--card:#20252a;--ink:#eceae4;--sub:#9aa3ad;--line:#343b42;--acc:#5cc0a6;--acc2:#1f332e;--ok:#5fd08d;--okbg:#1d3527;--ng:#f08a7c;--ngbg:#3b2220;--gold:#f0b94a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 60px}
h1{font-size:1.45rem;margin:.2em 0}
.lead{color:var(--sub);font-size:.9rem;margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.btn.pri{color:#10201c}}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--acc2);color:var(--acc)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.unit{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;display:block;width:100%}
.unit:hover{border-color:var(--acc)}
.unit b{display:block;font-size:.98rem}
.unit small{color:var(--sub);display:block}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:.85rem;margin-bottom:10px;gap:8px}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;margin:8px 0;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.msg{font-weight:700;margin:12px 0 0;min-height:1.6em}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
.ans{font-size:1.35rem;font-weight:800;color:var(--acc);margin:10px 0;min-height:2em}
.big{font-size:2.6rem;font-weight:800;margin:.1em 0}
.star{color:var(--gold);font-size:1.6rem;letter-spacing:4px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
td.a{width:38%;font-weight:700;color:var(--acc)}
td.a.hide span{visibility:hidden}
td.a.hide{background:var(--acc2);cursor:pointer;border-radius:6px}
.note{color:var(--sub);font-size:.8rem;margin-top:24px}
.back{color:var(--acc);text-decoration:none;font-weight:600;background:none;border:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stats b{display:block;font-size:1.35rem;line-height:1.3}.stats b i{font-style:normal;font-size:.8rem;color:var(--sub);font-weight:600}
.stats small{color:var(--sub);font-size:.72rem}.stats .warn b{color:var(--ng)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.badge{display:inline-block;background:var(--ngbg);color:var(--ng);border-radius:999px;padding:0 9px;font-size:.75rem;font-weight:700;margin-left:8px}
.tag{display:inline-block;background:var(--ngbg);color:var(--ng);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700}
.alert{background:var(--ngbg);color:var(--ng);border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:600}
h2{font-size:1.05rem;margin:22px 0 8px}
.tb th{text-align:left;font-size:.8rem;color:var(--sub);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.mini{border:1px solid var(--ng);color:var(--ng);background:none;border-radius:8px;padding:3px 9px;font-size:.82rem;font-weight:700}
.cnt{color:var(--ng);font-weight:700}.dot{color:var(--ng)}.un{color:var(--sub)}
textarea{width:100%;height:160px;margin-top:8px;font:inherit;font-size:.82rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.okline{color:var(--ok);font-size:.85rem;font-weight:600;margin:4px 0}
.alert{margin:4px 0}
.uh{font-weight:700;background:var(--acc2);color:var(--acc);border-radius:6px}.okc{color:var(--ok);font-weight:700}
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.bz{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 2px 4px;text-align:center}
.bz span{display:block;font-size:1.9rem;line-height:1.3}.bz small{display:block;font-size:.68rem;color:var(--sub)}
.bz.off span{filter:grayscale(1);opacity:.35}.bz:not(.off){border-color:var(--gold)}
.arena{text-align:center;margin:4px 0 12px}.face{font-size:5rem;line-height:1.2;display:inline-block}
.face.hit{animation:hit .45s}.face.down{filter:grayscale(1);transform:rotate(90deg);opacity:.6}
@keyframes hit{20%{transform:translateX(-10px) rotate(-8deg)}50%{transform:translateX(10px) rotate(8deg);opacity:.5}80%{transform:translateX(-5px)}}
.bname{font-weight:800;font-size:1.1rem;margin-bottom:6px}
.hp{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.hp i{display:block;height:100%;background:var(--ng);transition:width .4s}
.brow{display:flex;justify-content:space-between;font-size:.85rem;color:var(--sub);margin-top:4px;font-weight:600}#cb{color:var(--gold)}
</style>
</head>

function totals(){const t={n:0,c:0,r:0,w:0,m:0,a:0,ok:0,ev:0};UNITS.forEach((_,u)=>{const s=unitStat(u);for(const k in t)t[k]+=s[k]});
  t.rate=t.a?Math.round(t.ok/t.a*100):null;t.cum=t.r+t.w?Math.round(t.r/(t.r+t.w)*100):null;return t}
function everWrong(){return every().filter(x=>rec0(key(x)).w>0).sort((a,b)=>rec0(key(b)).w-rec0(key(a)).w||a.u-b.u||a.i-b.i)}

/* ---- ホーム ---- */
function home(){
  screen='home';const t=totals(),g=st.days[today()]||[0,0];
  let h=`<h1>社会データバンク 暗記クイズ</h1>
  <p class="lead">地理データバンク ${UNITS.filter(u=>!u.j).reduce((a,u)=>a+u.q.length,0)} 問と、時事問題 ${UNITS.filter(u=>u.j).reduce((a,u)=>a+u.q.length,0)} 問。1回 ${N} 問、3分でおわります。</p>
  <div class="stats"><div><b>${g[0]}</b><small>今日といた数</small></div><div><b>${g[0]?Math.round(g[1]/g[0]*100)+'%':'–'}</b><small>今日の正答率</small></div>
  <div><b>${t.c}<i> / ${t.n}</i></b><small>クリアした問題</small></div><div class="${t.m?'warn':''}"><b>${t.m}</b><small>復習まちの問題</small></div></div>
  <p class="${cloud==='ok'||lsOK||idbOK?'okline':'alert'}">${whereSaved()}。</p>
  <div class="bar"><button class="btn pri" id="rev" ${t.m?'':'disabled'}>復習する（${t.m}問）</button>
  <button class="btn" id="mix">全範囲からランダム ${N} 問</button><button class="btn" id="rc">記録を見る</button><button class="btn" id="wl" ${t.ev?'':'disabled'}>まちがえた問題の一覧（${t.ev}問）</button></div>
  <div class="bar"><div class="seg">
  <button data-m="quiz" class="${mode==='quiz'?'on':''}">4択クイズ</button>
  <button data-m="card" class="${mode==='card'?'on':''}">めくりカード</button>
  <button data-m="list" class="${mode==='list'?'on':''}">一覧でチェック</button></div></div><h2>ボスバトル（たおした数 ${UNITS.filter((_,k)=>beaten(k)).length} / ${UNITS.length}）</h2>
  <div class="bosses">${UNITS.map((u,k)=>`<button class="bz ${beaten(k)?'':'off'}" data-b="${k}"><span>${bossOf(k)[0]}</span><small>${esc(u.t.split('　')[0])}</small></button>`).join('')}</div>
  <p class="note" style="margin-top:6px">ボスをタップするとバトル開始。正解でこうげき、まちがえるとハートがへります。復習まちの問題はボスの弱点です。</p>
  <h2>地理データバンク</h2><div class="units">`;
  UNITS.forEach((u,k)=>{const s=unitStat(k);
    if(u.j&&!(UNITS[k-1]||{}).j)h+=`</div><h2>時事問題（2026年のニュース）</h2><div class="bar"><button class="btn" id="jmix">時事からランダム ${N} 問</button></div><div class="units">`;
    h+=`<button class="unit" data-u="${k}"><b>${esc(u.t)}</b><small>${s.c} / ${s.n} 問クリア${s.rate==null?'':'　正答率 '+s.rate+'%'}</small>${s.m?`<span class="badge">復習 ${s.m}</span>`:''}<div class="meter"><i style="width:${Math.round(s.c/s.n*100)}%"></i></div></button>`});
  h+=`</div><p class="note">まちがえた問題は「復習まち」に入り、2回つづけて正解すると卒業します。地理の数値と順位はデータバンク（N64-01〜04）の記載どおりです。時事問題は2026年11月時点のニュース記事をもとに作りました。【手書きメモ】とある問題は、プリントの書きこみから作りました。</p>`;
  $.innerHTML=h;
  $.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;home()});
  $.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>start(+b.dataset.u));
  document.getElementById('rev').onclick=()=>review(null);
  document.getElementById('mix').onclick=()=>run(shuf(every()).slice(0,N),'全範囲ランダム');
  document.getElementById('rc').onclick=()=>records();
  $.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>boss(+b.dataset.b));
  document.getElementById('wl').onclick=wrongList;
  const jm=document.getElementById('jmix');if(jm)jm.onclick=()=>{let a=[];UNITS.forEach((u,k)=>{if(u.j)a=a.concat(all(k))});run(shuf(a).slice(0,N),'時事ランダム')};
  window.scrollTo(0,0);

function review(u){const p=pending(u);if(!p.length)return;
  // まちがえた回数が多い順に、古いものから
  p.sort((a,b)=>rec0(key(b)).w-rec0(key(a)).w||(rec0(key(a)).t||0)-(rec0(key(b)).t||0));
  run(shuf(p.slice(0,N)),u==null?'復習':'復習：'+UNITS[u].t,u,true)}
function start(u){
  if(mode==='list')return list(u);
  const a=all(u),pe=shuf(a.filter(x=>rec0(key(x)).m)),todo=shuf(a.filter(x=>!rec0(key(x)).m&&!rec0(key(x)).r)),rest=shuf(a.filter(x=>!rec0(key(x)).m&&rec0(key(x)).r));
  // 復習まちを最大4問まぜ、のこりは未クリアを優先
  const pick=pe.slice(0,4).concat(todo).concat(pe.slice(4)).concat(rest).slice(0,N);
  run(shuf(pick),UNITS[u].t,u);
}

/* ---- 出題 ---- */
function run(qs,title,u,isRev){
  if(!qs.length)return home();
  screen='run';qs=qs.slice();const base=qs.length;let k=0,score=0;const miss=[];
  function ans(x,ok){mark(x,ok);if(!x.re){if(ok)score++;else{miss.push(x);qs.push(Object.assign({},x,{re:1}))}}}
  function head(x){return `<div class="top"><button class="back" id="bk">← やめる</button><span>${esc(title)}　${x.re?'もう一度':(k+1)+' / '+base}</span></div>${x.re?'<div class="tag">さっきまちがえた問題</div>':rec0(key(x)).m?'<div class="tag">復習まちの問題</div>':''}`}
  function next(){k++;k<qs.length?show():result()}
  function show(){
    const x=qs[k];
    if(mode==='card'){
      $.innerHTML=`<div class="card">${head(x)}<div class="q">${esc(x.q)}</div><div class="ans" id="an"></div>
      <div class="bar" id="b1"><button class="btn pri" id="sh">答えを見る</button></div>
      <div class="bar" id="b2" hidden><button class="btn" id="ng">✕ まだ</button><button class="btn pri" id="ok">○ おぼえた</button></div></div>`;
      document.getElementById('sh').onclick=()=>{document.getElementById('an').textContent=x.a;document.getElementById('b1').hidden=true;document.getElementById('b2').hidden=false};
      document.getElementById('ok').onclick=()=>{ans(x,true);next()};
      document.getElementById('ng').onclick=()=>{ans(x,false);next()};
    }else{
      const os=opts(x);
      $.innerHTML=`<div class="card">${head(x)}<div class="q">${esc(x.q)}</div>${os.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
      <div class="msg" id="mg"></div><div class="bar"><button class="btn pri" id="nx" hidden>つぎへ →</button></div></div>`;
      const bs=[...$.querySelectorAll('.opt')];
      bs.forEach((b,i)=>b.onclick=()=>{
        const ok=os[i]===x.a;bs.forEach((c,j)=>{c.disabled=true;if(os[j]===x.a)c.classList.add('ok')});
        if(!ok)b.classList.add('ng');ans(x,ok);
        const m=document.getElementById('mg');m.textContent=ok?'○ 正解！':'✕ 正解は「'+x.a+'」';m.className='msg '+(ok?'ok':'ng');
        const n=document.getElementById('nx');n.hidden=false;n.onclick=next;
      });
    }
    document.getElementById('bk').onclick=home;window.scrollTo(0,0);
  }
  function result(){
    screen='result';const p=score/base,s=p===1?3:p>=.8?2:p>=.5?1:0,left=pending(u).length;
    let h=`<div class="card"><div class="top"><span>${esc(title)}</span></div><div class="star">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div>
    <div class="big">${score} / ${base}</div><p>${p===1?'パーフェクト！':p>=.8?'あと少しで全問正解！':p>=.5?'半分こえた。まちがえた問題は復習まちに入ったよ。':'下の答えを見てから、もう一回やってみよう。'}</p>`;
    if(miss.length)h+=`<table>${miss.map(x=>`<tr><td>${esc(x.q)}</td><td class="a"><span>${esc(x.a)}</span></td></tr>`).join('')}</table>`;
    h+=`<div class="bar">${left?`<button class="btn pri" id="rv">復習する（${left}問）</button>`:''}${u!=null&&!isRev?'<button class="btn" id="ag">この単元をつづける</button>':''}<button class="btn" id="hm">単元えらびへ</button></div></div>`;
    $.innerHTML=h;
    const rv=document.getElementById('rv');if(rv)rv.onclick=()=>review(u);
    const ag=document.getElementById('ag');if(ag)ag.onclick=()=>start(u);
    document.getElementById('hm').onclick=home;window.scrollTo(0,0);
  }
  show();
}

/* ---- ボスバトル ---- */
const BOSS=[['🗻','フジヤマ大王'],['🌀','タイフーン'],['🏙️','メガシティ'],['🌾','イナホ将軍'],['🍎','アップルキング'],['🥬','キャベツ仙人'],['🐄','モーモー親分'],['🐙','大ダコ'],['🌲','森のヌシ'],['⚡','カミナリ電鬼'],['🤖','メカロボ'],['🚄','暴走エクスプレス'],['🚢','コンテナ船長'],['🛢️','タンカー男爵'],['🏛️','国会の番人'],['🐉','ワールドドラゴン'],['🌋','マグマ獣']];
const bossOf=u=>BOSS[u]||['👾','なぞのボス'];
const beaten=u=>((st.boss||{})[u]||{}).n||0;
function boss(u){
  screen='boss';const B=bossOf(u),MAX=12,a=all(u);let hp=MAX,life=3,combo=0,turn=0;const miss=[];
  // 復習まち（弱点）→ まだといていない問題 → のこり の順に出す
  let queue=shuf(a.filter(x=>rec0(key(x)).m)).concat(shuf(a.filter(x=>!rec0(key(x)).m&&!rec0(key(x)).r))).concat(shuf(a.filter(x=>!rec0(key(x)).m&&rec0(key(x)).r))),qi=0;
  function nextQ(){if(qi>=queue.length){queue=shuf(a);qi=0}return queue[qi++]}
  const hearts=()=>'❤️'.repeat(life)+'🤍'.repeat(3-life);
  function show(){
    const x=nextQ(),weak=!!rec0(key(x)).m,os=opts(x);turn++;
    $.innerHTML=`<div class="card"><div class="top"><button class="back" id="bk">← にげる</button><span>ボスバトル　${esc(UNITS[u].t)}</span></div>
    <div class="arena"><div class="face" id="fc">${B[0]}</div><div class="bname">${esc(B[1])}</div>
    <div class="hp"><i id="hp" style="width:${hp/MAX*100}%"></i></div><div class="brow"><span id="hpt">HP ${hp} / ${MAX}</span><span id="cb">${combo>=2?combo+'れんぞく正解！':''}</span><span id="lf">${hearts()}</span></div></div>
    ${weak?'<div class="tag">弱点！ 正解で大ダメージ</div>':''}<div class="q">${esc(x.q)}</div>${os.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
    <div class="msg" id="mg"></div><div class="bar"><button class="btn pri" id="nx" hidden>つぎへ →</button></div></div>`;
    const bs=[...$.querySelectorAll('.opt')];
    bs.forEach((b,i)=>b.onclick=()=>{
      const ok=os[i]===x.a;bs.forEach((c,j)=>{c.disabled=true;if(os[j]===x.a)c.classList.add('ok')});
      const m=document.getElementById('mg'),fc=document.getElementById('fc');
      if(ok){combo++;const dmg=1+(combo>=3?1:0)+(weak?1:0);hp=Math.max(0,hp-dmg);fc.classList.add('hit');
        m.textContent='○ 正解！ '+dmg+' ダメージ'+(weak?'（弱点）':'')+(combo>=3?'（コンボ）':'');m.className='msg ok'}
      else{b.classList.add('ng');combo=0;life--;miss.push(x);queue.push(x);
        m.textContent='✕ 正解は「'+x.a+'」　ハートが1つへった';m.className='msg ng'}
      mark(x,ok);
      document.getElementById('hp').style.width=hp/MAX*100+'%';document.getElementById('hpt').textContent='HP '+hp+' / '+MAX;
      document.getElementById('lf').textContent=hearts();document.getElementById('cb').textContent=combo>=2?combo+'れんぞく正解！':'';
      const n=document.getElementById('nx');n.hidden=false;n.textContent=hp<=0?'とどめ！ →':life<=0?'けっかを見る →':'つぎへ →';
      n.onclick=()=>hp<=0?end(true):life<=0?end(false):show();
    });
    document.getElementById('bk').onclick=home;window.scrollTo(0,0);
  }
  function end(win){
    screen='result';const first=win&&!beaten(u);
    if(win){st.boss=st.boss||{};const b=st.boss[u]||{n:0,best:0};b.n++;b.best=Math.max(b.best,life);st.boss[u]=b;save()}
    let h=`<div class="card"><div class="top"><span>ボスバトル　${esc(UNITS[u].t)}</span></div>
    <div class="arena"><div class="face ${win?'down':''}">${B[0]}</div><div class="bname">${win?esc(B[1])+' をたおした！':esc(B[1])+' にまけた…'}</div></div>
    <p>${win?(first?'バッジをゲット！ ':'')+'のこりハート '+'❤️'.repeat(life)+'　'+turn+' 問で勝利':'ボスののこりHPは '+hp+'。まちがえた問題を見てから、もう一度ちょうせんしよう。'}</p>`;
    if(miss.length)h+=`<table>${miss.map(x=>`<tr><td>${esc(x.q)}</td><td class="a"><span>${esc(x.a)}</span></td></tr>`).join('')}</table>`;
    h+=`<div class="bar"><button class="btn pri" id="ag">${win?'もう一度たたかう':'もう一度ちょうせん'}</button><button class="btn" id="hm">もどる</button></div></div>`;
    $.innerHTML=h;document.getElementById('ag').onclick=()=>boss(u);document.getElementById('hm').onclick=home;window.scrollTo(0,0);
  }
  show();
}

/* ---- 一覧 ---- */
function list(u){
  screen='list';const a=all(u);
  $.innerHTML=`<div class="card"><div class="top"><button class="back" id="bk">← もどる</button><span>${esc(UNITS[u].t)}　${a.length}問</span></div>
  <div class="bar"><button class="btn" id="tg">答えをぜんぶ表示</button></div>
  <table>${a.map(x=>`<tr><td>${rec0(key(x)).m?'<span class="dot">●</span> ':''}${esc(x.q)}</td><td class="a hide"><span>${esc(x.a)}</span></td></tr>`).join('')}</table>
  <p class="note"><span class="dot">●</span> は復習まちの問題です。答えのらんをタップすると表示されます。</p></div>`;
  $.querySelectorAll('td.a').forEach(t=>t.onclick=()=>t.classList.toggle('hide'));
  let shown=false;
  document.getElementById('tg').onclick=function(){shown=!shown;$.querySelectorAll('td.a').forEach(t=>t.classList.toggle('hide',!shown));this.textContent=shown?'答えをぜんぶかくす':'答えをぜんぶ表示'};
  document.getElementById('bk').onclick=home;window.scrollTo(0,0);
}

/* ---- これまでにまちがえた問題の一覧 ---- */
function wrongList(){
  screen='wl';const a=everWrong(),pe=a.filter(x=>rec0(key(x)).m).length;
  let h=`<div class="card"><div class="top"><button class="back" id="bk">← もどる</button><span>まちがえた問題の一覧　${a.length}問</span></div>
  <p class="lead">これまでに1回でもまちがえた問題です（復習まち ${pe}問、いまは正解 ${a.length-pe}問）。</p>`;
  if(a.length){h+=`<div class="bar"><button class="btn pri" id="go">この中から ${Math.min(N,a.length)} 問とく</button><button class="btn" id="tg">答えをぜんぶ表示</button></div><table>`;
    let cu=-1;a.slice().sort((x,y)=>x.u-y.u||rec0(key(y)).w-rec0(key(x)).w||x.i-y.i).forEach(x=>{const r=rec0(key(x));
      if(x.u!==cu){cu=x.u;h+=`<tr><td colspan="2" class="uh">${esc(UNITS[x.u].t)}</td></tr>`}
      h+=`<tr><td><span class="cnt">×${r.w}</span> ${esc(x.q)}<br><small class="${r.m?'cnt':'okc'}">${r.m?'復習まち':'いまは正解'}</small></td><td class="a hide"><span>${esc(x.a)}</span></td></tr>`});
    h+=`</table><p class="note">×の数字はまちがえた回数です。答えのらんをタップすると表示されます。</p>`}
  else h+='<p class="lead">まだまちがえた問題はありません。</p>';
  $.innerHTML=h+'</div>';
  document.getElementById('bk').onclick=home;
  $.querySelectorAll('td.a').forEach(c=>c.onclick=()=>c.classList.toggle('hide'));
  const tg=document.getElementById('tg');let shown=false;
  if(tg)tg.onclick=function(){shown=!shown;$.querySelectorAll('td.a').forEach(c=>c.classList.toggle('hide',!shown));this.textContent=shown?'答えをぜんぶかくす':'答えをぜんぶ表示'};
  const go=document.getElementById('go');
  // 復習まちを先に、のこりはまちがえた回数が多い順
  if(go)go.onclick=()=>{const p=a.filter(x=>rec0(key(x)).m).concat(a.filter(x=>!rec0(key(x)).m));run(shuf(p.slice(0,N)),'まちがえた問題')};
  window.scrollTo(0,0);
}

/* ---- 記録 ---- */
function lastDays(n){const r=[];for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);const k=today(d),g=st.days[k]||[0,0];r.push([k,g[0],g[1]])}return r}
function report(){const t=totals(),L=['社会データバンク 暗記クイズ 成績（'+today()+'）','クリア '+t.c+' / '+t.n+'問　いまの正答率 '+(t.rate==null?'–':t.rate+'%')+'（累計 '+(t.cum==null?'–':t.cum+'%')+'）　まちがえたことがある '+t.ev+'問　復習まち '+t.m+'問　たおしたボス '+UNITS.filter((_,k)=>beaten(k)).length+' / '+UNITS.length,'','■ 日別（といた数／正解）'];
  lastDays(7).forEach(d=>L.push(d[0].slice(5).replace('-','/')+'　'+d[1]+'問／'+d[2]+'問'));
  L.push('','■ 単元別（クリア／いまの正答率／復習まち）');
  UNITS.forEach((u,k)=>{const s=unitStat(k);L.push(u.t+'　'+s.c+'/'+s.n+'　'+(s.rate==null?'–':s.rate+'%')+'　'+s.m+'問')});
  const p=pending(null).sort((a,b)=>rec0(key(b)).w-rec0(key(a)).w);
  if(p.length){L.push('','■ 復習まちの問題（まちがえた回数）');p.forEach(x=>L.push('×'+rec0(key(x)).w+'　'+x.q+' → '+x.a))}
  return L.join('\n')}
function records(noPull){
  screen='rec';if(!noPull&&ref)pull();const t=totals(),p=pending(null).sort((a,b)=>rec0(key(b)).w-rec0(key(a)).w);
  let h=`<div class="card"><div class="top"><button class="back" id="bk">← もどる</button><span>記録</span></div>
  <div class="stats"><div><b>${t.c}<i> / ${t.n}</i></b><small>クリアした問題</small></div><div><b>${t.rate==null?'–':t.rate+'%'}</b><small>いまの正答率</small></div>
  <div><b>${t.r+t.w}</b><small>といた回数</small></div><div class="${t.m?'warn':''}"><b>${t.m}</b><small>復習まちの問題</small></div></div>
  <p class="note" style="margin-top:0">いまの正答率は、といた ${t.a} 問のうち、いちばん最近の回答が正解だった問題（${t.ok} 問）の割合です。まちがえた問題も、あとで正解すれば上がります。全回答の累計では ${t.cum==null?'–':t.cum+'%'} です。</p>
  <div class="bar"><button class="btn" id="wl2" ${t.ev?'':'disabled'}>まちがえた問題の一覧（${t.ev}問）</button></div>
  <h2>日ごとの記録（7日間）</h2><table class="tb"><tr><th>日</th><th>といた数</th><th>正解</th><th>正答率</th></tr>
  ${lastDays(7).map(d=>`<tr><td>${d[0].slice(5).replace('-','/')}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[1]?Math.round(d[2]/d[1]*100)+'%':'–'}</td></tr>`).join('')}</table>
  <h2>単元ごとの記録</h2><table class="tb"><tr><th>単元</th><th>クリア</th><th>いまの正答率</th><th>復習まち</th></tr>
  ${UNITS.map((u,k)=>{const s=unitStat(k);return `<tr><td>${esc(u.t)}</td><td>${s.c} / ${s.n}</td><td>${s.rate==null?'–':s.rate+'%'}</td><td>${s.m?`<button class="mini" data-r="${k}">${s.m}問 復習</button>`:'0'}</td></tr>`}).join('')}</table>
  <h2>復習まちの問題（${p.length}問）</h2>`;
  h+=p.length?`<div class="bar"><button class="btn pri" id="rv">まとめて復習する</button><button class="btn" id="tg">答えをぜんぶ表示</button></div>
  <table>${p.map(x=>`<tr><td><span class="cnt">×${rec0(key(x)).w}</span> ${esc(x.q)}<br><small class="un">${esc(UNITS[x.u].t)}</small></td><td class="a hide"><span>${esc(x.a)}</span></td></tr>`).join('')}</table>`
   :'<p class="lead">復習まちの問題はありません。</p>';
  h+=`<h2>成績を送る</h2><div class="bar"><button class="btn" id="cp">成績をコピー</button></div><textarea id="tx" readonly hidden></textarea>
  <p class="note">保存の状態：${whereSaved()}。</p></div>`;
  $.innerHTML=h;
  document.getElementById('bk').onclick=home;document.getElementById('wl2').onclick=wrongList;
  $.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>review(+b.dataset.r));
  $.querySelectorAll('td.a').forEach(c=>c.onclick=()=>c.classList.toggle('hide'));
  const rv=document.getElementById('rv');if(rv)rv.onclick=()=>review(null);
  const tg=document.getElementById('tg');let shown=false;
  if(tg)tg.onclick=function(){shown=!shown;$.querySelectorAll('td.a').forEach(c=>c.classList.toggle('hide',!shown));this.textContent=shown?'答えをぜんぶかくす':'答えをぜんぶ表示'};
  document.getElementById('cp').onclick=function(){const s=report(),tx=document.getElementById('tx'),b=this;tx.value=s;tx.hidden=false;
    const done=()=>{b.textContent='コピーしました'},fail=()=>{b.textContent='下の文をえらんでコピーしてね';tx.focus();tx.select()};
    try{navigator.clipboard.writeText(s).then(done,fail)}catch(e){fail()}};
  window.scrollTo(0,0);
}
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
</script>
</body>
</html>
